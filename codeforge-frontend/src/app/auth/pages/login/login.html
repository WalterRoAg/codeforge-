<div class="login-container">

  <div class="login-card">

    <button
      type="button"
      class="back-button"
      (click)="volverInicio()">
      ← Volver
    </button>


    <div class="brand">

      <div class="logo-icon">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <h1>CodeForge AI</h1>

      <p>
        Inicia sesión para continuar
      </p>

    </div>


    <form
      (ngSubmit)="iniciarSesion()"
    >

      <div class="form-group">

        <label for="username">
          Usuario
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Ingresa tu usuario"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          required
        >

      </div>


      @if (error) {

        <div class="error">
          {{ error }}
        </div>

      }


      <button
        type="submit"
        class="login-button"
        [disabled]="cargando"
      >

        {{
          cargando
            ? 'Ingresando...'
            : 'Iniciar sesión'
        }}

      </button>

    </form>


    <div class="registro-link">

      ¿No tienes una cuenta?

      <button
        type="button"
        (click)="irRegistro()"
      >
        Registrarse
      </button>

    </div>

  </div>

</div>
